name: Build and Sync to Hugging Face Space
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: |
          npm install --legacy-peer-deps
          npx vite build
          cp README.md dist/README.md
      - name: Push built site to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd dist
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -b main
          git add .
          git commit -m "Deploy built Alderbrook site"
          REPO="https://Dk-902505902:${HF_TOKEN}@huggingface.co/spaces/Dk-902505902/alderbrook-ai-town"
          git push --force "$REPO" main
          
